[project]
name = "janim"
version = "1.0.0"
description = "Mathematical animation in Python with the ManimGL vocabulary, on WebGPU"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy==2.4.6",
    "wgpu==0.21.0",
    "glfw==2.10.2",
    "freetype-py==2.5.1",
]

[tool.janim.bootstrap]
dependencies = [
    "cffi==2.1.1",
    "pycparser==3.0",
    "sniffio==1.3.1",
    "rubicon-objc==0.5.7; sys_platform == 'darwin'",
]
